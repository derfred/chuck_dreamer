# Build the Fessel production deploy artifacts on demand:
#   - the webui Docker image, pushed to ghcr under a stable tag
#   - the Pi dpkg (fessel-monitor_*.deb), uploaded as a workflow artifact
#
# The cluster (bugzoo-infrastructure -> lib/fessel) pulls the webui image by
# this tag; the dpkg is installed on the real Pi by hand from the artifact.
name: fessel release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. prod, v0.1.0)"
        default: prod
      dpkg_version:
        description: "dpkg version string"
        default: "0.1.0"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  webui-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build + push webui (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: src/fessel
          file: src/fessel/webui/deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/fessel-webui:${{ inputs.tag }}

  pi-dpkg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Pi dpkg in a Debian container
        run: |
          docker run --rm -v "$PWD/src/fessel:/src" -w /src debian:trixie bash -c '
            set -e
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-venv python3-pip dpkg-dev ca-certificates
            pi/deploy/dpkg/build-dpkg.sh "${{ inputs.dpkg_version }}"
          '
          ls -la src/fessel/dist
      - name: Upload dpkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: fessel-monitor-dpkg
          path: src/fessel/dist/*.deb
          if-no-files-found: error
