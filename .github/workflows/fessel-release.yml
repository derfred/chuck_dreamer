# Build + publish the Fessel production artifacts:
#   - webui Docker image -> ghcr (cluster pulls it)
#   - Pi dpkg (fessel-monitor_*.deb) -> added to the SIGNED apt repo on the
#     gh-pages branch (https://derfred.github.io/chuck_dreamer); the Pi
#     installs/upgrades via apt. See src/fessel/pi/deploy/apt/README.md.
#
# Triggered by a git tag (vX.Y.Z) or manually.
#
# The SINGLE SOURCE OF TRUTH for the release version is
# src/fessel/schemas/pyproject.toml. The dpkg version, the webui image tag,
# and the runtime /healthz stamp all derive from it, so the Pi package and
# the cluster image of a release always share one version. To cut a release,
# bump that pyproject version (and tag `v<version>` to match). There is no
# separate version input or image-tag knob — decoupling them is how the two
# halves of a release drift out of sync.
#
# PRERELEASE (edge) builds: run this workflow manually with a
# `prerelease_suffix` (e.g. rc1). The effective version becomes
# `<pyproject>-<suffix>` (e.g. 0.5.0-rc1), which sorts BELOW the stable
# `<pyproject>` in both dpkg and image-tag ordering. The image is pushed as
# `:0.5.0-rc1` (no stable pointer is moved) and the dpkg is published into the
# apt repo's separate `prerelease` component, so a stable Pi's `apt upgrade`
# never sees it. A Pi opts into edge with `fessel-channel edge`; the cluster
# deploys a prerelease by pinning its image tag to `:0.5.0-rc1`. No pyproject
# bump and no git tag are required — that's the point: deploy to Pi + cluster
# without cutting a release. See src/fessel/pi/deploy/apt/README.md.
name: fessel release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      prerelease_suffix:
        description: >-
          Prerelease/edge suffix (e.g. rc1). Set → build <pyproject>-<suffix>
          into the apt `prerelease` component + image :<version>, moving no
          stable pointer. Leave EMPTY for a real release.
        required: false
        default: ""

permissions:
  contents: write   # push to gh-pages
  packages: write   # push webui image to ghcr

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      image_tag: ${{ steps.v.outputs.image_tag }}
      is_prerelease: ${{ steps.v.outputs.is_prerelease }}
      apt_component: ${{ steps.v.outputs.apt_component }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          # Empty on a tag push; the operator-supplied suffix on a manual run.
          SUFFIX: ${{ github.event.inputs.prerelease_suffix }}
        run: |
          # The base version comes from schemas/pyproject.toml (the source of
          # truth); the dpkg, image tag, and /healthz stamp all derive from it.
          BASE="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' \
            src/fessel/schemas/pyproject.toml | head -n1)"
          if [ -z "$BASE" ]; then
            echo "could not read version from schemas/pyproject.toml" >&2
            exit 1
          fi

          if [ -n "$SUFFIX" ]; then
            # --- PRERELEASE / edge build (manual dispatch only) ---
            # dpkg version joins with `~` so `0.5.0~rc1` sorts BELOW the stable
            # `0.5.0` (tilde sorts before "nothing"); the real release then
            # cleanly supersedes the rc. Docker tags forbid `~`, so the image
            # tag joins with `-` instead (0.5.0-rc1). Reject characters that
            # aren't valid in BOTH so the two stay in lockstep.
            case "$SUFFIX" in
              *[!A-Za-z0-9.]*)
                echo "invalid prerelease_suffix '$SUFFIX' (allowed: A-Za-z0-9.)" >&2
                exit 1 ;;
            esac
            V="${BASE}~${SUFFIX}"          # dpkg version (apt)
            IMG="${BASE}-${SUFFIX}"        # docker tag (no '~' allowed)
            echo "is_prerelease=true"       >> "$GITHUB_OUTPUT"
            echo "apt_component=prerelease" >> "$GITHUB_OUTPUT"
          else
            # --- real release ---
            V="$BASE"
            IMG="$BASE"
            # On a tag push, the tag must match the pyproject version — catches
            # a tag/source mismatch before publishing under the wrong tag.
            if [ "${{ github.ref_type }}" = "tag" ]; then
              TAG_V="${GITHUB_REF_NAME#v}"
              if [ "$TAG_V" != "$V" ]; then
                echo "tag $GITHUB_REF_NAME (=$TAG_V) != pyproject version $V" >&2
                exit 1
              fi
            fi
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "apt_component=main"  >> "$GITHUB_OUTPUT"
          fi
          # `version` is the dpkg version (stamped into the .deb + /healthz);
          # `image_tag` is the docker-safe form. They differ only by the join
          # char on a prerelease (0.5.0~rc1 vs 0.5.0-rc1).
          echo "version=$V"     >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMG" >> "$GITHUB_OUTPUT"

  webui-image:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build + push webui (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: src/fessel/webui
          file: src/fessel/webui/deploy/go.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/fessel-webui:${{ needs.setup.outputs.image_tag }}
          # Stamp the version into the image (surfaced on /healthz). Use the
          # docker-safe image_tag so /healthz reports exactly the tag operators
          # pin (0.5.0-rc1). The Pi dpkg uses the `~` form (0.5.0~rc1) for
          # correct apt ordering; on a real release the two are identical.
          build-args: |
            FESSEL_VERSION=${{ needs.setup.outputs.image_tag }}

  pi-dpkg:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the Pi dpkg in a Debian trixie container (no venv)
        run: |
          docker run --rm -v "$PWD/src/fessel:/src" -w /src debian:trixie bash -c '
            set -e
            apt-get update
            apt-get install -y --no-install-recommends dpkg-dev ca-certificates
            pi/deploy/dpkg/build-dpkg.sh "${{ needs.setup.outputs.version }}"
          '
          ls -la src/fessel/dist
      - name: Upload dpkg artifact
        uses: actions/upload-artifact@v5
        with:
          name: fessel-monitor-dpkg
          path: src/fessel/dist/*.deb
          if-no-files-found: error

  publish-apt-repo:
    needs: [setup, pi-dpkg]
    runs-on: ubuntu-latest
    # Serialize with fessel-gst-plugins-rs.yml's publish job: both append to
    # the gh-pages apt repo, and a concurrent push would race.
    concurrency: fessel-apt-repo
    steps:
      - uses: actions/checkout@v5
        with:
          path: src-repo
      - name: Checkout gh-pages (the apt repo; preserves prior pool versions)
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages
      - name: Download the built .deb
        uses: actions/download-artifact@v5
        with:
          name: fessel-monitor-dpkg
          path: deb
      - name: Install apt-utils (apt-ftparchive) + gnupg
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg
      - name: Import signing key
        env:
          KEY: ${{ secrets.FESSEL_APT_GPG_PRIVATE_KEY }}
        run: echo "$KEY" | gpg --batch --import
      - name: Build + sign the apt repo into gh-pages
        run: |
          chmod +x src-repo/src/fessel/pi/deploy/apt/build-apt-repo.sh
          # Real releases -> `main`; prereleases -> `prerelease` (a stable Pi's
          # apt upgrade never sees prerelease until it runs `fessel-channel edge`).
          src-repo/src/fessel/pi/deploy/apt/build-apt-repo.sh \
            -c "${{ needs.setup.outputs.apt_component }}" \
            "$PWD/gh-pages" deb/*.deb
      - name: Commit + push gh-pages
        run: |
          cd gh-pages
          git config user.name "fessel-ci"
          git config user.email "fessel-ci@users.noreply.github.com"
          git add -A
          git commit -m "apt repo (${{ needs.setup.outputs.apt_component }}): fessel-monitor ${{ needs.setup.outputs.version }}" || {
            echo "nothing to commit"; exit 0; }
          git push
