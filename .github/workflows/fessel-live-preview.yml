# On-demand live preview: deploy Fessel with production WebRTC exposure and
# HTTPS Ingresses so a REAL browser (yours) can watch the stream and do the
# final video verification manually. The per-PR fessel-integration workflow
# stays fully automated; this is a separate manual tool.
#
# Usage (Actions tab -> "fessel live preview" -> Run workflow):
#   action=up   : build images (if tag missing), deploy, print URL, keep
#                 alive for ttl_minutes, then auto-teardown.
#   action=down : tear down the namespace now.
name: fessel live preview

on:
  workflow_dispatch:
    inputs:
      action:
        description: "up = deploy & keep alive; down = tear down"
        type: choice
        options: [up, down]
        default: up
      ttl_minutes:
        description: "Auto-teardown after N minutes (action=up)"
        default: "30"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  # Stable tag so repeated previews reuse images (built once).
  IMAGE_TAG: live-preview
  BASE_DOMAIN: derfred.com
  NS: fessel-live-preview

jobs:
  build:
    if: ${{ inputs.action == 'up' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build + push webui
        uses: docker/build-push-action@v6
        with:
          context: src/fessel/webui
          file: src/fessel/webui/deploy/go.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            FESSEL_VERSION=${{ env.IMAGE_TAG }}
          tags: ${{ env.REGISTRY }}/fessel-webui:${{ env.IMAGE_TAG }}
      - name: Build + push test-pi
        uses: docker/build-push-action@v6
        with:
          context: src/fessel
          file: src/fessel/pi/deploy/test-pi/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/fessel-test-pi:${{ env.IMAGE_TAG }}
      - name: Build + push test-driver
        uses: docker/build-push-action@v6
        with:
          context: src/fessel/integration/driver
          file: src/fessel/integration/driver/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/fessel-test-driver:${{ env.IMAGE_TAG }}

  up:
    if: ${{ inputs.action == 'up' }}
    needs: build
    runs-on: bugzoo
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl + tk
        run: |
          mkdir -p "$HOME/bin"
          curl -sSLo "$HOME/bin/kubectl" "https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl"
          curl -sSLo "$HOME/bin/tk" "https://github.com/grafana/tanka/releases/download/v0.31.3/tk-linux-amd64"
          chmod +x "$HOME/bin/kubectl" "$HOME/bin/tk"; echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Deploy live preview
        run: |
          cd src/fessel
          chmod +x integration/*.sh integration/live-preview/*.sh
          NS="$NS" IMAGE_TAG="$IMAGE_TAG" REGISTRY="$REGISTRY" \
            BASE_DOMAIN="$BASE_DOMAIN" \
            integration/live-preview/deploy.sh
      - name: Keep alive then auto-teardown
        run: |
          mins="${{ inputs.ttl_minutes }}"
          echo "preview will auto-teardown in ${mins} min (re-run with action=down to stop sooner)"
          sleep $(( mins * 60 ))
          cd src/fessel && NS="$NS" integration/live-preview/teardown.sh
      - name: Teardown on cancel/failure
        if: ${{ always() }}
        run: cd src/fessel && NS="$NS" integration/live-preview/teardown.sh || true

  down:
    if: ${{ inputs.action == 'down' }}
    runs-on: bugzoo
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl
        run: |
          mkdir -p "$HOME/bin"
          curl -sSLo "$HOME/bin/kubectl" "https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl"
          chmod +x "$HOME/bin/kubectl"; echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Tear down
        run: cd src/fessel && NS="$NS" integration/live-preview/teardown.sh
