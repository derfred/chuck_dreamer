[project]
name = "fessel-webui-backend"
version = "0.1.0"
description = "Fessel webui backend: WHEP URL minting + control-plane forwarders"
requires-python = ">=3.12"
dependencies = [
  "fessel-schemas",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "minio>=7.2",
]

[project.scripts]
# Binds BOTH listeners (public :8000 + tailnet-only ingest :8001) in one
# process (Slice 5.5, B5.5.7). The container CMD invokes this.
fessel-backend = "app.main:serve_both"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
fessel-schemas = { path = "../../schemas", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.format]
indent-style = "space"
