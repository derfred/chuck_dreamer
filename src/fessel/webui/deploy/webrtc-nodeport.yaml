# I1.2 — WebRTC media NodePort Services.
# externalTrafficPolicy: Local + no pod pinning. The mediamtx pod lands on
# one of three nodes; ICE succeeds on that node's public IP (advertised in
# webrtcAdditionalHosts) and fails silently on the others (Local drops
# NodePort traffic on nodes without a local pod). Port numbers MUST match
# webrtcLocalUDPAddress / webrtcLocalTCPAddress in the rendered config.
apiVersion: v1
kind: Service
metadata:
  name: mediamtx-webrtc-udp
  namespace: fessel
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: mediamtx
  ports:
    - name: webrtc-udp
      protocol: UDP
      port: 8189
      targetPort: 8189
      nodePort: 30890
---
apiVersion: v1
kind: Service
metadata:
  name: mediamtx-webrtc-tcp
  namespace: fessel
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: mediamtx
  ports:
    - name: webrtc-tcp
      protocol: TCP
      port: 8189
      targetPort: 8189
      nodePort: 30891
