# I1.1 — Fessel namespace + mediamtx Deployment + ConfigMap.
# The ConfigMap data is the RENDERED mediamtx.yml (from
# tools/render-mediamtx-config.sh); shown here as a placeholder that the
# deploy step overwrites. Single replica, strategy Recreate, upstream
# image pinned, no PersistentVolume.
apiVersion: v1
kind: Namespace
metadata:
  name: fessel
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mediamtx-config
  namespace: fessel
data:
  mediamtx.yml: |
    # PLACEHOLDER — replaced at deploy time by the rendered template
    # (render-mediamtx-config.sh < mediamtx.yml.template). Do not hand-edit.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediamtx
  namespace: fessel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mediamtx
  template:
    metadata:
      labels:
        app: mediamtx
    spec:
      # Non-root: on shared rke2/containerd nodes, root mediamtx can hit the
      # per-UID inotify-instance limit and crash at startup; a non-root uid
      # has its own budget.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: mediamtx
          # >= 1.13.0 required for authJWTExclude (publish exclusion).
          image: bluenviron/mediamtx:1.18.2
          args: ["/config/mediamtx.yml"]
          ports:
            - { name: srt, containerPort: 8890, protocol: UDP }
            - { name: webrtc-udp, containerPort: 8189, protocol: UDP }
            - { name: webrtc-tcp, containerPort: 8189, protocol: TCP }
            - { name: whep, containerPort: 8889, protocol: TCP }
            - { name: api, containerPort: 9997, protocol: TCP }
            - { name: metrics, containerPort: 9998, protocol: TCP }
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - { name: config, mountPath: /config }
      volumes:
        - name: config
          configMap:
            name: mediamtx-config
