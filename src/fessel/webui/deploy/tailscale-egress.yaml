# I1.4 — Tailscale EGRESS Service (cluster -> Pi control).
# Lets cluster pods (mediamtx's runOnDemand curl) reach supervisor's HTTPS
# control plane on the Pi. Cluster pods resolve
# supervisor.fessel.svc.cluster.local and traffic tunnels to the Pi.
#
# CRITICAL FOOTGUN — do NOT use the `tailscale.com/expose` annotation here.
# That is the ingress shape; applied to an outbound-intended Service it
# SILENTLY FAILS (the operator builds an ingress proxy with no upstream,
# DNS resolves, the connection succeeds, packets disappear). The correct
# OUTBOUND shape is type: ExternalName + tailscale.com/tailnet-fqdn.
apiVersion: v1
kind: Service
metadata:
  name: supervisor
  namespace: fessel
  annotations:
    tailscale.com/tailnet-fqdn: pi.example-tailnet.ts.net
spec:
  type: ExternalName
  externalName: placeholder  # operator rewrites to the egress proxy DNS name
  ports:
    - port: 8443
      protocol: TCP
