# I1.5 — HTTPS ingress for WHEP signaling.
# Browser-facing entry for the WHEP POST. Exposes mediamtx's WHEP HTTP
# endpoint at a public hostname with a valid cert and CORS for the
# webui/test-page origin. The backend (whep-url minting) is exposed under
# /api on the same host.
apiVersion: v1
kind: Service
metadata:
  name: mediamtx-whep
  namespace: fessel
spec:
  selector:
    app: mediamtx
  ports:
    - name: whep
      port: 8889
      targetPort: 8889
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fessel-media
  namespace: fessel
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://webui-dev.example.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["media-dev.example.com"]
      secretName: fessel-media-tls
  rules:
    - host: media-dev.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mediamtx-whep
                port:
                  number: 8889
