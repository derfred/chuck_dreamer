[project]
name = "fessel-schemas"
version = "0.4.3"
description = "Fessel canonical wire schemas (single source of truth)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fessel_schemas"]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.format]
indent-style = "space"
