[project]
name = "fessel-schemas"
version = "0.5.1"
description = "Fessel canonical wire schemas (single source of truth)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fessel_schemas"]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.lint]
# Pin the rule set explicitly: `uvx ruff` floats to the newest release, and
# newer defaults (e.g. RUF100) would otherwise flag the deliberate
# `# noqa: ANN0xx/BLE001` annotations this codebase uses as "unused".
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
indent-style = "space"
