# I0.5 — Fessel CI. Build, lint, and test each sub-project on push.
# Packaging targets (dpkg, Docker, Tanka) are present as skipped
# placeholders so the pipeline shape exists ahead of the packaging slice.
#
# NOTE: place/symlink this under the host repo's .github/workflows/ to
# activate it, or reference it from the host CI. Path filter limits runs to
# changes under src/fessel/.
name: fessel-ci

on:
  push:
    paths: ["src/fessel/**"]
  pull_request:
    paths: ["src/fessel/**"]

defaults:
  run:
    working-directory: src/fessel

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [schemas, pi/shared, pi/supervisor, webui/backend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
        working-directory: src/fessel/${{ matrix.project }}
      - run: uv run pytest -q
        working-directory: src/fessel/${{ matrix.project }}
      - run: uvx ruff check .
        working-directory: src/fessel/${{ matrix.project }}

  video:
    # video needs system GStreamer/PyGObject in the runner image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system GStreamer + PyGObject
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gst-plugins-bad-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-tools v4l-utils
      - name: Create system-site-packages venv and test
        run: |
          python3 -m venv --system-site-packages .venv
          ./.venv/bin/pip install -e . -e ../../schemas -e ../shared pytest
          ./.venv/bin/python -m pytest -q
        working-directory: src/fessel/pi/video

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: src/fessel/webui/frontend
      - run: npm run lint
        working-directory: src/fessel/webui/frontend
      - run: npm run test
        working-directory: src/fessel/webui/frontend

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dpkg (placeholder)
        run: echo "skipped — arrives in a later slice"
      - name: docker image (placeholder)
        run: echo "skipped — arrives in a later slice"
      - name: tanka (placeholder)
        run: echo "skipped — arrives in a later slice"
