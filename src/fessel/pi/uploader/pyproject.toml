[project]
name = "fessel-uploader"
version = "0.1.0"
description = "Fessel Pi-side uploader: PUTs flagged recordings to webui-backend's recording-ingest endpoint (V5.5.1)"
requires-python = ">=3.12"
dependencies = [
  "fessel-schemas",
  "fessel-shared",
  # HTTPS client for the recording-ingest PUTs. The Pi is now an HTTPS client
  # only — NO MinIO SDK, NO S3 credentials (Slice 5.5 V5.5.2). Imported lazily
  # by the 'http' driver; tests inject a fake client and never import it.
  "httpx>=0.27",
]

[project.scripts]
uploader = "uploader.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uploader"]

[tool.uv.sources]
fessel-schemas = { path = "../../schemas", editable = true }
fessel-shared = { path = "../shared", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.lint]
# Pin the rule set explicitly: `uvx ruff` floats to the newest release, and
# newer defaults (e.g. RUF100) would otherwise flag the deliberate
# `# noqa: ANN0xx/BLE001` annotations this codebase uses as "unused".
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
indent-style = "space"
