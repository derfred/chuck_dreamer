[project]
name = "fessel-uploader"
version = "0.1.0"
description = "Fessel Pi-side uploader: ships flagged recordings to MinIO (V4.7)"
requires-python = ">=3.12"
dependencies = [
  "fessel-schemas",
  "fessel-shared",
  # MinIO / S3-compatible object store client. Only imported at runtime on the
  # Pi via the 'minio' driver; tests inject a fake object store and never import
  # it (mirrors supervisor's pywizlight seam).
  "minio>=7.2",
]

[project.scripts]
uploader = "uploader.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uploader"]

[tool.uv.sources]
fessel-schemas = { path = "../../schemas", editable = true }
fessel-shared = { path = "../shared", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.format]
indent-style = "space"
