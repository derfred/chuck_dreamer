[project]
name = "fessel-video"
version = "0.1.0"
description = "Fessel video process: GStreamer pipeline + live state machine"
requires-python = ">=3.12"
# NOTE: PyGObject (gi), numpy, and OpenCV (cv2) are NOT pip dependencies. video
# binds to the system GObject-introspection libraries (and, for Slice-5 vision
# analysis, the apt-provided numpy + python3-opencv), so its venv must be created
# with --system-site-packages against the system Python. See pi/deploy and the
# repo dev-env docs. pip-installing pygobject/opencv here would shadow the system
# bindings and break GStreamer. The pure detector logic (vision.py / audio.py /
# anomaly_recording.py) is unit-tested without numpy/cv2; only the gst_*_handle
# modules import them, lazily.
dependencies = [
  "fessel-schemas",
  "fessel-shared",
]

[project.scripts]
video = "video.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video"]

[tool.uv.sources]
fessel-schemas = { path = "../../schemas", editable = true }
fessel-shared = { path = "../shared", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.lint]
# Pin the rule set explicitly: `uvx ruff` floats to the newest release, and
# newer defaults (e.g. RUF100) would otherwise flag the deliberate
# `# noqa: ANN0xx/BLE001` annotations this codebase uses as "unused".
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
indent-style = "space"
