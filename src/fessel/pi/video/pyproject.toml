[project]
name = "fessel-video"
version = "0.1.0"
description = "Fessel video process: GStreamer pipeline + live state machine"
requires-python = ">=3.12"
# NOTE: PyGObject (gi) is NOT a pip dependency. video binds to the
# system GObject-introspection libraries, so its venv must be created with
# --system-site-packages against the system Python. See pi/deploy and the
# repo dev-env docs. pip-installing pygobject here would shadow the system
# bindings and break GStreamer.
dependencies = [
  "fessel-schemas",
  "fessel-shared",
]

[project.scripts]
video = "video.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video"]

[tool.uv.sources]
fessel-schemas = { path = "../../schemas", editable = true }
fessel-shared = { path = "../shared", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.format]
indent-style = "space"
