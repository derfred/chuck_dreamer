# Test-image supervisor config. Plain HTTP (no TLS) on 0.0.0.0:8443 so
# mediamtx's runOnDemand curl and the test Job can reach it over in-cluster
# Service DNS (stands in for the Tailscale egress).
mqtt:
  host: 127.0.0.1
  port: 1883

http:
  host: 0.0.0.0
  port: 8443

# Slice 3 control plane wired to MOCKS so the per-PR harness exercises the full
# chain (backend -> supervisor -> actuators) without real power. NO real WiZ /
# Jetson is dialed: `wiz.driver: fake` uses an in-memory bulb, and `jetson` is a
# mock HTTP server (integration/mocks/jetson_mock.py) reachable in-cluster.
control:
  wiz:
    driver: fake          # in-memory FakeBulb; production uses 'pywizlight'
    retries: 3
    retry_delay_s: 0.05
  plugs:
    # `jetson` is the happy-path plug (power-cycled and verified in the test).
    # `arm` is wired to always DROP commands so /api/control/shutdown/arm
    # deterministically fails verify -> 503 — the safety-path assertion. Both
    # are real plug names the backend's fixed /api/control/* surface exposes
    # (the backend only forwards the seven known actions, so the failing plug
    # must be `arm` or `jetson`, not a synthetic name). No real power either way.
    jetson: { mode: ok }
    arm: { mode: drop }
  jetson:
    base_url: http://jetson-mock:8080
    timeout_s: 3.0
  refresh:
    jetson_s: 2.0          # fast so /state freshens within a test window
    plug_s: 2.0
