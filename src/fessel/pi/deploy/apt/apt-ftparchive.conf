// apt-ftparchive config for the Fessel apt repo Release file.
// One suite (stable). Components: `main` (real releases) and `prerelease`
// (edge/rc builds — see the fessel-channel helper). The actual component list
// is passed on the command line by build-apt-repo.sh (it discovers whichever
// components exist in pool/); the value below is only a single-component
// default for a hand-run.
// arm64 alongside all: gstreamer1.0-plugins-rs-fessel ships compiled plugins.
APT::FTPArchive::Release {
  Origin "Fessel";
  Label "Fessel";
  Suite "stable";
  Codename "stable";
  Architectures "all arm64";
  Components "main";
  Description "Fessel Pi monitoring packages";
};
