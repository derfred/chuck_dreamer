// apt-ftparchive config for the Fessel apt repo Release file.
// Flat repo: one suite (stable), one component (main).
// arm64 alongside all: gstreamer1.0-plugins-rs-fessel ships compiled plugins.
APT::FTPArchive::Release {
  Origin "Fessel";
  Label "Fessel";
  Suite "stable";
  Codename "stable";
  Architectures "all arm64";
  Components "main";
  Description "Fessel Pi monitoring packages";
};
