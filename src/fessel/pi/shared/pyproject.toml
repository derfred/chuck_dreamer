[project]
name = "fessel-shared"
version = "0.1.0"
description = "Shared Pi-side code: MQTT client, config, topic constants, SSD storage layout"
requires-python = ">=3.12"
dependencies = [
  # fessel-schemas: storage.py produces/consumes RecordingMetadata (V4.4), the
  # canonical wire shape. Shared owns the on-disk layout that uses it.
  "fessel-schemas",
  "paho-mqtt>=2.1",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fessel_shared"]

[tool.uv.sources]
fessel-schemas = { path = "../../schemas", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.format]
indent-style = "space"
