[project]
name = "fessel-supervisor"
version = "0.1.0"
description = "Fessel supervisor: control plane + MQTT relay (Slice 1)"
requires-python = ">=3.12"
dependencies = [
  "fessel-schemas",
  "fessel-shared",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.scripts]
supervisor = "supervisor.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["supervisor"]

[tool.uv.sources]
fessel-schemas = { path = "../../schemas", editable = true }
fessel-shared = { path = "../shared", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.format]
indent-style = "space"
