# Default configuration for Chuck Dreamer

seed: null  # Randomized at runtime if unset

model:
  rssm:
    stoch_size: 30
    deter_size: 200
    hidden_size: 200
    min_stddev: 0.1
  encoder:
    embed_size: 200
    mlp_hidden: [200, 200]
    # Wider early channels + 128×128 input so a ~3 px ball survives more
    # conv stages before going sub-pixel. Five stride-2 stages bottleneck
    # at 4×4 spatial as before.
    cnn_channels: [96, 192, 256, 256, 256]
    cnn_kernels:  [4, 4, 4, 4, 4]
    cnn_strides:  [2, 2, 2, 2, 2]
    # Derived: 4 * prod(cnn_strides) so the encoder bottlenecks at 4×4 spatial.
    image_size: ${derive_image_size:${.cnn_strides}}
  decoder:
    mlp_hidden: [200, 200]
    cnn_channels: [96, 192, 256, 256, 256]
    cnn_kernels:  [4, 4, 4, 4, 4]
    cnn_strides:  [2, 2, 2, 2, 2]
  reward:
    hidden: [200, 200]
  aux:
    # Auxiliary regression head: latent feat -> ground-truth target.
    # target_dim = len(object_xy) + len(ee_pos) = 2 + 3 = 5. The buffer
    # pulls these from step_info; aux loss is only added when
    # training.losses.aux_scale > 0.
    target_dim: 5
    hidden: [200, 200]
  actor:
    hidden: [300, 300, 300]
    min_stddev: 0.1
    init_stddev: 5.0
    mean_scale: 5.0
  critic:
    hidden: [300, 300, 300]

training:
  policy: "dreamer"  # "dreamer" or "scripted"
  batch_size: 32
  seq_len: 50
  num_iterations: 100
  num_collect_episodes: 5
  num_gradient_steps: 10
  min_episode_len: 50
  save_every: 10
  eval_every: 5

  collector:
    # "sync"  — collect episodes inline in the trainer process (today's
    #           behavior, default for local dev).
    # "async" — spawn ``num_workers`` worker processes that collect
    #           continuously in the background; the trainer drains the
    #           queue between train phases.
    mode: "sync"
    num_workers: 4               # ignored when mode=sync
    max_pending: 64              # episode_q cap (async only); backpressures workers when trainer falls behind
    # How often (in iterations) the trainer broadcasts the latest model
    # weights to async workers. Workers train on stale weights between
    # broadcasts — fine for Dreamer's WM (off-policy data) but you may
    # want this lower if the actor/critic depend on fresh data. Ignored
    # when mode=sync or policy=scripted.
    weight_broadcast_every_n_iters: 5

  data:
    # These defaults are applied to all warmup sources, but you can override per-source in the list form of warmup_source.
    warmup_format: "rerun"  # "hdf5" or "rerun"
    warmup_num_episodes: 100  # null = load all; otherwise sample this many at random

    # Accepts: a single path string, a dict {path, [format], [num_episodes]},
    # or a list of either. load_config() normalizes to a list[dict] with every
    # entry fully populated.
    warmup_source: "data/warmup/"
    # Example list form:
    # warmup_source:
    #   - "data/warmup_sim/"
    #   - path: "data/real/"
    #     num_episodes: null   # load all real recordings

    protected_tags: []
    tag_weights: {}

    warmup_num_workers: null   # null = os.cpu_count(); 0 = sequential load
    buffer_size: 10000

  optimizer:
    wm_lr: 6e-4
    actor_lr: 8e-5
    critic_lr: 8e-5
    adam_eps: 1e-5
    gradient_clipping: 100.0

  losses:
    recon_scale: 1.0
    reward_scale: 1.0
    kl_scale: 1.0
    free_nats: 3.0
    # Auxiliary head loss (object_xy + ee_pos regression from the latent).
    aux_scale: 0.0
    focus_masks: ["segmentation_target", "segmentation_arm", "segmentation_goal"]  # obs keys to apply "focus" weighting to
    focus_scale: 5.0 # an additional weight on obs reconstruction loss for the "focus region"

logging:
  logger: "trackio" # "none", "wandb", "trackio"
  project_name: "chuck-dreamer"
  save_dir: "checkpoints"
  experiment_name: null  # Will be auto-generated if null
  episodes:
    dump_path: null         # null = disabled. Output dir for episode dumps (collect + eval).
    dump_format: "rerun"    # "hdf5" or "rerun"
    every_n_collects: 100   # int or null to disable, regularly dump the episodes produced during collect phase.
    every_n_evals: 1        # int or null to disable, regularly dump the episodes processed during eval phase.

eval:
  # These defaults are applied to all sources, but you can override per-source in the list form of source.
  data_format: "rerun"  # "hdf5" or "rerun"
  num_episodes: null    # null = load all; otherwise sample this many at random

  source: "data/eval/"
  # Example list form:
  # source:
  #   - "data/eval_sim/"
  #   - path: "data/eval_real/"
  #     format: "rerun"
  #     num_episodes: null  # load all real eval recordings

  burn_in: 5  # Posterior steps before switching to prior in the open-loop rollout.

  # Deep eval — slow, in-depth analysis that complements the per-phase
  # online metrics. The trainer fires a detached `python main.py eval`
  # subprocess every Nth eval phase (so it does not block training);
  # the same code path runs synchronously when `main.py eval` is invoked
  # by hand on a checkpoint.
  deep:
    every_n_evals: null      # int or null to disable in-training deep eval.
    notebooks:                # Notebooks under src/chuck_dreamer/evals/ to execute.
      - open_loop_rollout
      - latent_probe
    recordings: true         # Also dump per-episode rerun recordings of the rollout.
    output_dir: "eval_runs"  # Where executed notebooks + recordings land.
    num_episodes: 20         # Episode budget per deep-eval pass.
    horizon: 15              # Open-loop horizon length (steps after burn_in).

hardware:
  device: "mlx"  # "auto", "mlx", "cpu", "cuda", "mps"

# CEM planner params, read by `sim/cli.py`'s `show-scene` command.
real:
  policy:
    cem:
      horizon:        12
      num_samples:    256
      num_elites:     32
      num_iterations: 4

env:
  difficulty: "real"
  render_size: "512x512"
  table_size: [0.60, 0.5, 0.02]  # [half_x, half_y, half_z]
  max_steps: null  # Per-episode step cap; null uses the difficulty preset's default.

  # Any non-empty subset of: "image" (CNN), "joints" (MLP over
  # joint_qpos), "proprio" (MLP over joint_qpos), "ee" (MLP over
  # ee_pos + ee_quat), "object_xy" (MLP over object_xy),
  # "object_uv" (MLP over object pixel coords). Each listed component
  # gets its own encoder/decoder branch; embeddings are fused to embed_size.
  obs_mode: ["image"]
  act_mode: "ee"      # "joint" | "ee"

  reward: "goal_distance"

# SO-101 pushing runtime (chuck_dreamer.runtime). Drives the arm through a
# trusted control kernel (synchronized slew + joint velocity limit +
# authoritative clamp + HOLD/NORMAL/ESTOP mode machine) behind a backend
# protocol. Launched by `python main.py run`. M0/M1: no policy yet — the arm
# is driven by a scripted setpoint source. This block is read only by the
# runtime; the rest of the config is untouched by it.
runtime:
  # Loop rates (Hz). 50 Hz control (read-every-tick) is the recommended
  # default; the scripted source publishes setpoints at the slower policy rate.
  control_rate_hz: 50
  policy_rate_hz:  10

  # Run length. null -> run until SIGINT (Ctrl-C). A float bounds the run,
  # used by demos and tests. CLI: `--duration 2` or `-o runtime.duration_s=2`.
  duration_s: null

  # Backend selection (import-path-plus-params, spec §3.2/§8). FakeBackend
  # is a no-physics echo arm (the kernel's slew/clamp shapes all motion).
  # Swap to MujocoBackend for sim physics + an optional 3D viewer:
  #   target: "chuck_dreamer.runtime.mujoco_backend:MujocoBackend"
  #   params: { realtime: true }
  # Or the real SO-101 follower over USB (M1 hardware swap-in). The joint
  # envelope + jaw bounds come from `safety` below, not from params:
  #   target: "chuck_dreamer.runtime.feetech_backend:FeetechBackend"
  #   params: { port: "/dev/tty.usbmodemXXX", calibration_id: null,
  #             use_degrees: true, read_decimation: 1 }
  backend:
    target: "chuck_dreamer.runtime.backend:FakeBackend"
    params: {}

  # Authoritative joint-space safety envelope (the kernel's clamp + slew).
  safety:
    joint_names: ["Rotation", "Pitch", "Elbow", "Wrist_Pitch", "Wrist_Roll", "Jaw"]
    # Per-joint position bounds (rad). null -> read from backend.joint_limits()
    # (MuJoCo model ranges). FakeBackend has no model, so set these when using it.
    joint_lower: [-1.92, -3.32, -0.174, -1.66, -2.79, -0.174]
    joint_upper: [ 1.92,  0.174,  3.14,  1.66,  2.79,  1.75]
    # Joint-space velocity limit (rad/s). Scalar (broadcast) or per-joint list.
    max_velocity: 1.5
    # Boot pose; matches the so100 SceneConfig default home.
    home_qpos: [0, -3.14, 3.14, 0, 0, 0]

    # Following-error watchdog (spec §3.14): trips the safety latch on
    # sustained tracking failure (obstruction, self-collision, servo
    # malfunction) — the only safety layer that closes a loop on measured
    # state. theta_0/T are global (shared servo model); k is per-joint
    # (distal joints need a larger allowance per unit commanded velocity).
    # Defaults are placeholders pending the offline calibration recipe in
    # spec §3.14 (2-3x resting/typical-velocity p99 |e|); DO NOT ship
    # without recalibrating against real recordings.
    following_error_watchdog:
      enabled: true
      theta_0: 0.25    # rad
      k: 0.1           # s; scalar (all joints) or per-joint list
      T: 0.15          # s

  # Sensors (M3, spec §3.1/§4.2): latest-value producer slots sampled at
  # policy-step time. Each declares the modalities it produces; the startup
  # composition fails fast if a required modality is unproduced. Empty by
  # default — cameras are backend-specific, so enable one explicitly.
  # `render_size` reuses the "HxW" convention.
  # MuJoCo scene render (needs MujocoBackend):
  #   - target: "chuck_dreamer.runtime.sensors:SimCameraSensor"
  #     params: { camera: "main_camera", name: "camera/front", render_size: "240x320" }
  # Real camera:
  #   - target: "chuck_dreamer.runtime.sensors:WebcamSensor"
  #     params: { device_index: 0, render_size: "480x640" }
  sensors: []

  # Perception pipeline (M3, spec §3.2/§3.3): ordered modules run inline at the
  # start of each policy step, each declaring consumed/emitted modalities. Empty
  # by default (the scaffold). EePoseModule is cheap + real-time (FK only);
  # ObjectLocalizerModule wraps the SAM2 pose estimator and needs M4 calibration
  # (and a first_frame_prompt, since there's no UI until M7) — keep it off here.
  perception: []
    # - target: "chuck_dreamer.runtime.perception:EePoseModule"
    # - target: "chuck_dreamer.runtime.perception_object:ObjectLocalizerModule"
    #   params: { dataset_id: "user/dataset", first_frame_prompt: [160, 120] }

  # Modalities the session declares it needs (spec §9.1 step 5). Startup raises
  # if any are unproduced by the sensors + perception above. Empty for the
  # scripted M3 sources (they need only t / q_meas); a real policy unions in its
  # declared obs-space at M6.
  required_modalities: []

  # Scripted setpoint source (M1; replaced by the policy at M6).
  source:
    kind: "sine_sweep"        # "go_to_pose" | "sine_sweep" | "manual" | custom import path
    go_to_pose:
      q_goal: "home"          # "home" or an explicit per-joint list
      duration_s: 3.0
    sine_sweep:
      amplitude: 0.3          # rad; scalar (all joints) or per-joint list
      freq_hz:   0.25         # Hz; scalar or per-joint
      phase:     0.0          # rad; scalar or per-joint

  # Leader arm (M2, spec §3.8). The leader is a *sensor*, decoupled from the
  # policy: when `enabled`, a background thread polls it and exposes its joints
  # as the `leader_qpos` observation modality regardless of `source.kind`. Any
  # policy may read that modality; `source.kind: manual` (ManualPolicy) passes
  # it straight through as the joint-space action (the kernel's slew/clamp still
  # bounds motion to the envelope). With no leader enabled, `leader_qpos` is
  # absent and ManualPolicy simply holds.
  #
  # The reader is import-path-plus-params so it is swappable: the default target
  # is the FakeLeaderReader (no hardware) so sim/headless/tests run as-is; the
  # real arm is a target swap (or `--leader-port`, which also flips `enabled`).
  # The follower jaw bounds the gripper percentage maps into are injected from
  # the resolved safety envelope, not configured here.
  leader:
    enabled: false   # start the reader whenever a leader is configured
    target: "chuck_dreamer.runtime.teleop:FakeLeaderReader"
    params:
      # Constant follower-ordered radians pose; null -> latest() is None and a
      # consuming policy holds. Override for a non-trivial fake pose in tests.
      pose: null
    # Real device:
    #   enabled: true
    #   target: "chuck_dreamer.runtime.teleop:LerobotLeaderReader"
    #   params: { port: "/dev/tty.usbmodemXXX", calibration_id: null,
    #             use_degrees: true, poll_rate_hz: 100 }

  # External heartbeat watchdog (spec §10.5): a control loop that goes
  # silent past this latches the kernel into ESTOP. Tune to the fat (read) tick.
  watchdog:
    timeout_s: 0.1

  # Telemetry -> Rerun (spec §3.11). The flat per-tick record shape is unchanged
  # from M0; M3 swaps the sink from CSV to a Rerun .rrd (one per episode) that
  # also carries the policy thread's sensor frames, perception outputs, and
  # composed observations on a shared timeline. `queue_maxsize` bounds the
  # control telemetry queue; `obs_queue_maxsize` bounds the policy-thread
  # observation queue (drop-on-full so the policy loop never blocks on encoding).
  logging:
    queue_maxsize: 10000
    rerun:
      rrd_dir: "runtime_logs/rrd"
      obs_queue_maxsize: 256

  # Optional MuJoCo viewer (off by default -> headless / test-safe). When on
  # it draws the commanded setpoint + current EE markers; the task-space
  # safety box overlay is deferred to M5.
  viewer:
    enabled: false

# Object-localization pipeline (chuck_dreamer.real.object_localization).
# Used by `python main.py calibrate-intrinsics` + `python main.py annotate-mat`
# to calibrate cameras from LeRobot recordings, and by the
# `import-lerobot --with-object-pose` stage to populate object_xy. All
# distance values are in millimeters.
object_localization:
  # Camera frame key shared across calibration datasets.
  camera_key: "observation.images.front"

  # Episode indices (shared across calibration datasets).
  episodes:
    empty:        0   # mat + arm, no checkerboard, no object
    checkerboard: 1   # checkerboard waved through the scene
    object_left:  2
    object_mid:   3
    object_right: 4

  # Checkerboard geometry. `inner_corners` is the spec's `size` field
  # under a longer-lived name; both refer to (cols, rows) of interior
  # intersections in cv2's convention.
  checkerboard:
    inner_corners: [9, 6]
    square_mm:     25.0

  # Mat fiducials — measured once on the physical mat. Set these to your
  # actual numbers before running calibration. The pipeline asserts
  # they are floats at startup and refuses to run otherwise. The names
  # map to the spec's L / D / r symbols.
  mat:
    line_length_mm:     300.0   # L: length of each white line
    line_separation_mm: 160.0   # D: perpendicular distance between the two lines
    circle_radius_mm:   50.0    # r: radius of the white circle
    circle_samples:     64      # N, matched to the UI's ellipse sample count
    # Black-mat extent in world coords. The mat origin (circle center)
    # is at the world origin; the fiducial assembly extends from
    # x = -L (far line tips) to x = +r (circle's +X edge). Lines sit
    # at y = ±D/2.
    #
    # Margins (measured on the physical mat, edges measured from the
    # nearest fiducial extent):
    #   * 70 mm past the circle's +X edge   (robot-side margin)
    #   * 140 mm past the far line tips     (back side)
    #   * 140 mm past each line             (sides)
    #
    # Gives world bbox: x in [-L - 140, r + 70] = [-440, +120]
    #                   y in [-D/2 - 140, D/2 + 140] = [-220, +220].
    extent_xmin_mm:     -440.0
    extent_xmax_mm:     +120.0
    extent_ymin_mm:     -220.0
    extent_ymax_mm:     +220.0

  intrinsics:
    n_frames_target:   5       # sample this many frames from the checkerboard episode
    rms_threshold_px:  1.0      # warn (not fail) above this
    coverage_grid:    [6, 4]    # >=80% of cells must contain >=1 detected corner
    # Distortion model. 5 -> Brown-Conrady (k1, k2, p1, p2, k3); 2 ->
    # k1+k2 only with p1=p2=k3=0; 0 -> pinhole, no distortion. With
    # <~20 views the higher-order coefficients are not well-constrained
    # and inflate test-time error; 2 is the safe default for sparse fits.
    distortion_model:  5
    # Constrain the focal-length and principal-point parameterization
    # when views are sparse / clustered. Forcing fy = fx removes a free
    # parameter that the optimizer otherwise burns to overfit residuals
    # along the cluster axis; fixing the principal point at the image
    # center is a sensible prior for most cameras. Turn both on when
    # you have <~20 views or all views land in the same image region.
    fix_aspect_ratio:    false
    fix_principal_point: false

  extrinsics:
    rms_threshold_px:  1.0
    annotation_frame:  0        # frame of episode `empty` to annotate

  # Pose-estimator runtime knobs.
  object:
    mesh_path:        "assets/RobotLearning_Rhombicuboctahedron_Object.3mf"
    sam2_checkpoint:  "facebook/sam2-hiera-large"
    n_yaw_inits:      4
    silhouette:
      chamfer_max_iter: 100
    edges:
      canny_low:        50
      canny_high:       150
      search_range_px:  25
      max_iter:         50

  # Paths read by the `import-lerobot --with-object-pose` stage.
  mesh_path: "assets/RobotLearning_Rhombicuboctahedron_Object.3mf"
  use_sam2:  true   # set false to force the color-heuristic segmenter
  device:    "auto"  # "auto" | "cpu" | "cuda" | "mps"


# Artifact store (docs/trainer/artifact_store.md): persisted pipeline
# artifacts + provenance records. The segmentation stage caches its SAM2
# masks here so re-imports skip the GPU pass. Unset/empty disables caching.
store:
  root: "store"
