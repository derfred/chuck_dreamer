# Default configuration for Chuck Dreamer

seed: null  # Randomized at runtime if unset

model:
  rssm:
    stoch_size: 30
    deter_size: 200
    hidden_size: 200
    min_stddev: 0.1
  encoder:
    embed_size: 200
    mlp_hidden: [200, 200]
    cnn_channels: [32, 64, 128, 256]
    cnn_kernels:  [4, 4, 4, 4]
    cnn_strides:  [2, 2, 2, 2]
    # Derived: 4 * prod(cnn_strides) so the encoder bottlenecks at 4×4 spatial.
    image_size: ${derive_image_size:${.cnn_strides}}
  decoder:
    mlp_hidden: [200, 200]
    cnn_channels: [32, 64, 128, 256]
    cnn_kernels:  [4, 4, 4, 4]
    cnn_strides:  [2, 2, 2, 2]
  reward:
    hidden: [200, 200]
  aux:
    # Auxiliary regression head: latent feat -> ground-truth target.
    # target_dim = len(object_xy) + len(ee_pos) = 2 + 3 = 5. The buffer
    # pulls these from step_info; aux loss is only added when
    # training.losses.aux_scale > 0.
    target_dim: 5
    hidden: [200, 200]
  actor:
    hidden: [300, 300, 300]
    min_stddev: 0.1
    init_stddev: 5.0
    mean_scale: 5.0
  critic:
    hidden: [300, 300, 300]

training:
  policy: "dreamer"  # "dreamer" or "scripted"
  batch_size: 32
  seq_len: 50
  num_iterations: 100
  num_collect_episodes: 5
  num_gradient_steps: 10
  min_episode_len: 50
  save_every: 10
  eval_every: 5

  data:
    warmup_path: "data/warmup/"
    warmup_format: "rerun"  # "hdf5" or "rerun"
    warmup_num_episodes: 100  # null = load all; otherwise sample this many at random
    warmup_num_workers: null   # null = os.cpu_count() // 2; 0 = sequential load
    shuffle: true
    buffer_size: 10000

  optimizer:
    wm_lr: 6e-4
    actor_lr: 8e-5
    critic_lr: 8e-5
    adam_eps: 1e-5
    gradient_clipping: 1000.0
    weight_decay: 0

  losses:
    recon_scale: 1.0
    reward_scale: 1.0
    kl_scale: 1.0
    free_nats: 3.0
    entropy_scale: 1.0
    # Auxiliary head loss (object_xy + ee_pos regression from the latent).
    aux_scale: 0.0
    focus_masks: ["segmentation_target", "segmentation_arm", "segmentation_goal"]  # obs keys to apply "focus" weighting to
    focus_scale: 5.0 # an additional weight on obs reconstruction loss for the "focus region"

logging:
  logger: "trackio" # "none", "wandb", "trackio"
  project_name: "chuck-dreamer"
  save_dir: "checkpoints"
  experiment_name: null  # Will be auto-generated if null
  episodes:
    dump_path: null         # null = disabled. Output dir for episode dumps (collect + eval).
    dump_format: "rerun"    # "hdf5" or "rerun"
    every_n_collects: 100   # int or null to disable, regularly dump the episodes produced during collect phase.
    every_n_evals: 1        # int or null to disable, regularly dump the episodes processed during eval phase.

eval:
  data_path: "data/eval/"
  data_format: "rerun"  # "hdf5" or "rerun
  num_episodes: null # null = load all; otherwise sample this many at random
  burn_in: 5  # Posterior steps before switching to prior in the open-loop rollout.

hardware:
  device: "mlx"  # "auto", "mlx", "cpu", "gpu", "mps"

env:
  difficulty: "medium"
  render_size: "512x512"
  table_size: [0.60, 0.5, 0.02]  # [half_x, half_y, half_z]
  max_steps: null  # Per-episode step cap; null uses the difficulty preset's default.

  obs_mode: "image"   # "state" | "image" | "image_proprio"
  act_mode: "ee"      # "joint" | "ee"

  reward: "goal_distance"

# Real-hardware recording (CLI: chuck-dreamer record).
# Phase A registers the scene (camera intrinsics + marker locations); phase B
# delegates to lerobot.scripts.lerobot_record.record() for episode capture.
recording:
  robot:
    type: "so101_follower"
    port: "/dev/tty.usbmodem-replace-me"
    id: null
  teleop:
    type: "so101_leader"
    port: "/dev/tty.usbmodem-replace-me"
    id: null
  cameras:
    # name -> camera config. width/height/fps accept "auto" to probe the
    # device's native settings at cfg-resolve time.
    top:
      type: "opencv"
      index_or_path: 0
      width: "auto"
      height: "auto"
      fps: "auto"
  cameras_defaults:
    fallback_fps: 30   # Used when the device reports fps=0 on probe.
  dataset:
    repo_id: "local/chuck-pushing"
    single_task: "Push the block to the goal"
    fps: 30
    episode_time_s: 30
    reset_time_s: 10
    num_episodes: 50
    push_to_hub: false
    streaming_encoding: true
    encoder_threads: 2
  scene:
    primary_camera: "top"
    checkerboard:
      cols: 9                 # inner corners per row
      rows: 6                 # inner corners per col
      square_size_m: 0.025
    min_calibration_captures: 5
    marker_locations: ["off_screen", "start", "obstacle", "target"]
    marker_clip_duration_s: 3.0
    marker_clip_min_blob_frames: 0.8
    save_marker_raw_frames: true
