[project]
name = "chuck-dreamer"
version = "0.1.0"
description = "Robot Learning Group Project: Chuck Dreamer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # MLX - Apple's ML framework (Apple Silicon only)
    "mlx>=0.17.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # TensorFlow for TFRecord support
    "tensorflow>=2.15.0",
    "tensorflow-datasets>=4.9.0",
    # Core ML and data processing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    # Computer Vision
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    # ML frameworks (alternatives to MLX)
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scikit-learn>=1.3.0",
    # Robotics and RL
    "gymnasium>=0.29.0",
    "mujoco>=3.0.0",
    # URDF forward kinematics (chuck_dreamer.common.fk)
    "pin>=3.0.0",
    # Tensor operations
    "einops>=0.7.0",
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    # File formats and data handling
    "h5py>=3.9.0",
    "zarr>=2.15.0",
    # Configuration and experiment tracking
    "omegaconf>=2.3.0",
    "wandb>=0.15.0",
    "hydra-core>=1.3.0",
    # Development tools
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    # Transformers (for pre-trained models)
    "transformers>=4.30.0",
    "tokenizers>=0.13.0",
    # Jupyter for development
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.1.0",
    "papermill>=2.5.0",
    "lxml>=6.0.4",
    "lxml-stubs>=0.5.1",
    "types-tqdm>=4.67.3.20260408",
    "trackio[mcp]>=0.25.1",
    "datasets>=4.8.5",
    "trimesh>=4.12.2",
    "rerun-sdk[all]>=0.30.0",
    "lerobot[dataset,feetech,placo-dep]>=0.6.1",
    "pynput>=1.8.2",
    "sam-2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chuck_dreamer"]
# Ship the PEP 561 marker so mypy treats chuck_dreamer as typed. Without it,
# function-level (deferred) imports resolve to the installed package and are
# reported as "missing library stubs or py.typed marker".
artifacts = ["src/chuck_dreamer/py.typed"]

[tool.black]
line-length = 160
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 160

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
# src/fessel is a self-contained sub-project with its own CI/type-checking.
exclude = '^src/fessel/'

[tool.uv]
# Only resolve for the platforms that exist in this project: dev machines
# (macOS arm64), the Jetson (linux aarch64) and CI runners (linux x86_64).
# Drops the win32 fork entirely - no pywin32, pywinpty, colorama.
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
sam-2 = { git = "https://github.com/facebookresearch/sam2.git" }
torch = [
  { index = "jetson", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
  { index = "jetson", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchcodec = [
  { index = "jetson", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "jetson"
url = "https://pypi.jetson-ai-lab.io/sbsa/cu132"
explicit = true

# CI runners (linux x86_64) have no GPU; the CPU-only wheels avoid pulling
# several GB of nvidia-* CUDA packages onto the runner.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.mypy.overrides]]
module = ["mlx", "mlx.*", "mujoco", "mujoco.*", "pinocchio", "h5py", "pyarrow", "pyarrow.*", "rerun", "tqdm", "tqdm.*", "scipy", "scipy.*", "sam2.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
    "autopep8>=2.3.2",
]
